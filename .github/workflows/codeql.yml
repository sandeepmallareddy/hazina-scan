name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Add a weekly `schedule:` trigger when the repository is public.

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    # Code scanning is available on public repositories; skip until this one is public.
    if: ${{ !github.event.repository.private }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
