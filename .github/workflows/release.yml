name: Release

# PyPI trusted publishing will be added to this workflow once the repository is public;
# until then, releases are GitHub Releases with the built artifacts attached.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Checksum distributions
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
